[project]
name = "vinkra"
version = "0.2.0a1"
description = "A lightweight vector database with incremental inserts, automatic exact-to-ANN switching, and explicit storage management. Add vectors anytime without rebuilding the index"
authors = [
    { name = "speedyk_005", email = "speedy40115719@gmail.com" }
]

license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = ["vector-database", "ann", "approximate-nearest-neighbor", "similarity-search", "embedding-vectors", "semantic-search", "rag", "retrieval-augmented-generation", "llm", "generative-ai", "product-quantization", "vector-search", "ai", "information-retrieval", "knowledge-base"]

dependencies = [
    # rii requires pybind11>=2.9, but newer versions (3.x) build significantly faster.
    "pybind11>=3.0,<4.0",

    "rii>=0.2.12,<1.0",
    "readerwriterlock>=1.0.9,<2.0",

    # pysqlite3 0.6 is the only version with prebuilt wheels.
    # 0.7 hasn't been released yet, so we're sticking with 0.6 for now.
    "pysqlite3>=0.6,<0.7",

    "pydantic>=2.10.0,<3.0",
    "uuid6>=2025.0.0; python_version < '3.14'",
    "loguru>=0.7.3,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    #"ruff>=0.14.14",
    "python-docstring-markdown>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/speedyk-005/vinkra"
Repository = "https://github.com/speedyk-005/vinkra"

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vinkra", "vinkra.utils", "vinkra.strategies"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "--cov=vinkra --cov-report=term-missing:skip-covered --durations=10"
testpaths = ["tests"]
filterwarnings = [
    "ignore:One of the clusters is empty:UserWarning",
    "ignore:unclosed database:ResourceWarning",
]
python_files = "test_*.py"

[tool.coverage.run]
omit = [
    "src/vinkra/strategies/base.py",
    "src/vinkra/**/__init__.py",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "A",      # Built-in shadowing and variable shadowing checks
    "ARG",    # Unused function and method arguments
    "B",      # Likely bugs and dangerous patterns (flake8-bugbear)
    "BLE",    # Blind exception handling (e.g. bare except)
    "C90",    # McCabe complexity checks
    "E",      # pycodestyle errors (PEP 8 violations)
    "ERA",    # Commented-out dead code detection
    "F",      # Pyflakes logical and static analysis errors
    "FBT",    # Boolean positional argument "traps"
    "FIX",    # TODO, FIXME, XXX comment detection
    "FURB",   # Refactoring and modernization suggestions (refurb)
    "I",      # Import sorting and organization (isort)
    "ICN",    # Import alias naming conventions
    "INP",    # Missing __init__.py package checks
    "N",      # PEP 8 naming conventions (pep8-naming)
    "PERF",   # Performance anti-patterns
    "PGH",    # Pygrep-hooks rules and miscellaneous checks
    "PIE",    # Unnecessary or non-pythonic code patterns
    "PL",     # Pylint-derived checks
    "PT",     # Pytest style and correctness checks
    "PTH",    # Prefer pathlib over os/path utilities
    "Q",      # Quote style consistency
    "RET",    # Return statement consistency and simplification
    "RSE",    # Raise statement improvements
    "RUF",    # Ruff-specific rules
    "S",      # Security issues and insecure code patterns (bandit)
    "SLF",    # Access to private members
    "SIM",    # Code simplification opportunities
    "TC",     # Type-checking block optimizations
    "TCH",    # Move typing-only imports into TYPE_CHECKING blocks
    "TID",    # Import restriction and tidiness rules
    "T10",    # Debugger breakpoint detection
    "UP",     # Python syntax and API modernization (pyupgrade)
    "W",      # pycodestyle warnings
]
ignore = ["PLW2901", "COM812", "D203", "D213", "RUF001", "RUF003", "RUF012", "S311", "PLR0913", "FURB167", "PLC0206", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "I001"]
"src/vinkra/utils/*.py" = ["PLR2004"]
"src/vinkra/core.py" = ["TC001", "SLF001"]
"src/vinkra/models.py" = ["PLW0108"]
"src/vinkra/strategies/approximate_search.py" = ["S301", "PLR2004"]
"src/vinkra/sql_wrapper.py" = ["S608", "PLR2004"]
"src/vinkra/latency_predictor.py" = ["SLF001"]
"tests/*" = ["E501", "S101", "PLR2004", "Q0", "ERA001", "SLF001", "PT", "ARG002", "INP001"]
